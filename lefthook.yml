pre-commit:
  commands:
    gitleaks:
      # Uses a local gitleaks if installed, otherwise the pinned Docker image.
      run: if command -v gitleaks >/dev/null; then gitleaks git --staged --no-banner --redact; else docker run --rm -v "$PWD":/repo -w /repo zricethezav/gitleaks:v8.21.2 git --staged --no-banner --redact /repo; fi
    biome:
      glob: "*.{ts,tsx,js,json}"
      run: pnpm biome check --no-errors-on-unmatched {staged_files}
